.lead{color:var(--mut);font-size:18px;line-height:1.5;max-width:560px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:34px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;

.play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;
background:rgba(4,21,27,.72);border:2px solid var(--teal);display:grid;place-items:center;box-shadow:0 0 24px rgba(70,217,210,.45)}

.num{position:absolute;left:12px;top:12px;font-size:13px;font-weight:800;letter-spacing:.12em;background:rgba(4,21,27,.75);

@media (prefers-reduced-motion:reduce){.panel{animation:none}.chev{transition:none}}
</style><script>
function copyLink(url,btn){
  const done=()=>{const t=btn.textContent;btn.textContent='Link copied';btn.classList.add('ok');setTimeout(()=>{btn.textContent=t;btn.classList.remove('ok')},1800)};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(done,()=>fallback(url,done))}else fallback(url,done);
}
function fallback(url,done){const a=document.createElement('textarea');a.value=url;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
  try{document.execCommand('copy');done()}catch(e){prompt('Copy this link:',url)}a.remove()}

function setOpen(item,on){
  const b=item.querySelector('.vbtn'),p=item.querySelector('.panel'),v=p.querySelector('video');
  item.classList.toggle('open',on);b.setAttribute('aria-expanded',on);p.hidden=!on;
  if(on){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}else{v.pause()}
}
function toggle(btn){
  const item=btn.closest('.item'),opening=!item.classList.contains('open');
  const before=btn.getBoundingClientRect().top;
  document.querySelectorAll('.item.open').forEach(o=>{if(o!==item)setOpen(o,false)});
  setOpen(item,opening);
  window.scrollBy(0,btn.getBoundingClientRect().top-before);
}
